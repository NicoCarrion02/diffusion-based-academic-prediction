services:
  diffusion-academic-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    image: pisa-diffusion:latest
    container_name: pisa_diffusion_container
    volumes:
      - ./data:/workspace/data
      - ./outputs:/workspace/outputs
      - ./configs:/workspace/configs
      - ./src:/workspace/src
      - ./run.py:/workspace/run.py
      - ./tests:/workspace/tests
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - LD_PRELOAD=/opt/conda/lib/libiconv.so
      - TABPFN_TOKEN=${TABPFN_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    command: python run.py --step all
