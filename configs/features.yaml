# Feature Engineering, Selection, and Leakage-Free Encoding Configuration

selection:
  target_k: 100                  # Top-k benchmark feature space (fitted inside each CV split)
  max_missing_ratio: 0.50        # Drop columns with >50% missing values on training split
  variance_threshold: 0.005      # Drop near-zero variance numeric columns on training split
  method: "hybrid_importance"    # 'hybrid_importance' (MI + ExtraTrees + Domain Anchors) or 'domain_anchors'

encoding:
  # Downstream classifier encoding fitted on observed training rows (X_tr, y_tr):
  # Options: 'target_encoder', 'catboost', 'frequency', 'one_hot', 'ordinal'
  categorical_strategy: "target_encoder"
  target_encoder_smoothing: 10.0

preprocessing:
  clean_survey_codes: true       # Metadata-driven sanitization of OECD non-response codes before splitting/selection
  numerical_imputer: "median"    # Training-split median via NativeImputer
  nominal_missing_token: "MISSING"
  scaler: "robust"               # 'robust' or 'standard'
