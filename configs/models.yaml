# Model Configurations: Diffusion Balancing, Random Forest, TabPFNv3

diffusion:
  strategy: "minority_generation" # Synthesize minority class (Class 1) to balance 1:1
  model_type: "tabrep"            # TabRep with CatConverter unit circle embedding
  cat_converter:
    dim: 2                        # Sine/Cosine phase space
  network:
    hidden_dims: [256, 512, 256]
    dropout: 0.10
    activation: "silu"
  training:
    epochs: 60
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.00001
    timesteps: 50
    solver: "heun"
    early_stopping_patience: 10

classifiers:
  random_forest:
    n_estimators: 300
    max_depth: 18
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"
    random_state: 42
    n_jobs: -1

  tabpfn:
    model_version: "v3"
    device: "cuda"
    random_state: 42
    thinking_mode: false

  xgboost:
    n_estimators: 250
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    random_state: 42
    eval_metric: "logloss"

validation:
  cv_folds: 5
  stratified: true
  random_state: 42
  evaluate_tabpfn_cv: false
